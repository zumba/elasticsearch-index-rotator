name: PHP Test

on:
  push:
    branches:
      - master
      - tmp-php-72-80
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      ES_TEST_HOST: http://localhost:9200
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          ini-values: error_reporting=-1, display_errors=On
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Run the suite
        shell: bash
        run: vendor/bin/phpunit 2>&1 | tee phpunit.log

      - name: Fail on deprecations raised in src
        run: |
          if grep -E "Deprecated: .* in ${GITHUB_WORKSPACE}/src/" phpunit.log; then
            exit 1
          fi
